<text x="32" y="82" fill="#f0f5f8" font-size="34" font-weight="700">Skills and tools for 3D print preparation.</text>
<text x="32" y="115" fill="#a4b7c8" font-size="18">Inspect geometry. Plan contact. Protect movement. Prepare material changes.</text>
