<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
<title id="title">Prender3D — selective bed retention</title>
<desc id="desc">Schematic of short native supports touching a tall fixed grip and radial contacts avoiding the joints of an articulated object. This is an illustration, not a toolpath or physical print result.</desc>
