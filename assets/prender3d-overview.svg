<text x="44" y="49" font-size="18" fill="#64e3a6" letter-spacing="3">DEDALO 3D SKILLS</text>
<text x="44" y="91" font-size="34" fill="#f2f5f8" font-weight="700">Hold the base. Keep the joints free.</text>
<text x="44" y="119" font-size="16" fill="#a7b8c8">Measure the fixed surfaces. Add only the native support the part needs.</text>
<text x="60" y="168" font-size="19" fill="#f2f5f8" font-weight="700">A small footprint</text>
